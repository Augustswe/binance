# ============================================================
# Binance U本位合约测试网 自动量化交易系统 配置
# ============================================================

# 交易模式: paper = 模拟下单(无需API Key), live = 真实测试网下单(需要API Key)
mode: live
network: testnet

# 主网分级解锁 (保护真实资金): 测试网跑满对应天数后主网开放并提高限额
# ⚠️ 请勿为提前解锁而回填过去的 since —— 这是保护你真实资金的安全护栏, 移除/篡改风险自负
# since:      测试网开跑基准时间(epoch秒); 留空则首次启动自动记录; 可填过去时间计入已运行天数
# custom_limit: 跑满90天(t3)后可自定义主网总持仓限额(USDT); 0 = 未设置(默认用 risk.max_total_position_notional)
mainnet:
  # 回填历史起点: 测试网账户最早真实活动日 (2026-08-16 20:17, 交易所 income 首条);
  # 原 mainnet_baseline 被 state 重启 bug 清零, 以此恢复真实已运行天数, 非提前解锁
  since: 1786882646
  custom_limit: 0

# 策略模式: multi = 多策略自适应评分 | donchian = Donchian通道突破趋势跟踪(长周期, 4年回测5币全正)
strategy_mode: donchian

# 运行模式 (手动选择用哪个策略下单):
#   auto  = 自动: 下方 modes.enabled 全部并行, 同币种先到先得 (默认)
#   <策略> = 只让指定策略开仓, 例如 donchian / multi / grid / ma_cross / rsi / bollinger
# 信号面板始终展示所有启用模式的判断; 仅"开仓权"受此值约束
run_mode: auto
allow_short: true   # 只做多: 禁止开做空单(即负评分信号); 设为 true 恢复允许做空

# 多模式并行 (可多选): donchian / multi / grid / ma_cross / rsi / bollinger
# 每个模式独立开仓独立统计, 同币种竞争制(先到先得), 系统按实盘表现分配资金权重
modes:
  enabled: [donchian, multi, ma_cross, rsi, bollinger]
  # 资金权重由学习器自动更新 (赚钱的模式权重高), 也可手动指定:
  # weights:
  #   donchian: 1.0
  #   multi: 1.0

# K线周期: 1m / 5m / 15m / 1h / 1d
timeframe: "1d"

# Donchian 通道突破参数 (海龟风格)
donchian:
  entry_n: 55       # 突破前55根K线最高/最低 → 入场
  exit_n: 20        # 反向突破前20根 → 出场(让利润奔跑)
  sl_atr: 2.5       # 止损 = 入场 ∓ 2.5 × ATR
  # 动态杠杆: 按突破深度(相对ATR)自动调倍率 - 强信号高倍开单, 弱信号低倍试错
  leverage:
    min: 1           # 弱信号最低杠杆 (试探仓)
    max: 5           # 强信号最高杠杆 (重仓)
  # 移动止损 (trailing stop): 随价格创新高/新低上移/下移止损线, 锁住浮盈
  trail:
    enabled: true    # 开启移动止损
    atr_mult: 2.0    # 止损线 = 极值 ∓ 2.0 × ATR (趋势中跟随)
    min_pct: 0.004   # 止损线至少移动 0.4% 才更新 (防频繁微调)

# 行情/持仓监控间隔 (秒)
poll_interval: 5

# 指标计算用K线数量
kline_limit: 300

# 交易对
symbols:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - XRPUSDT

# 杠杆策略: auto = 按波动率自动调整(1x-5x), fixed = 固定杠杆
leverage:
  mode: auto
  min: 1
  max: 5
  fixed: 3

# 风控 (激进模式)
risk:
  max_single_order_notional: 1000
  max_total_position_notional: 2000
  margin_per_position: 200
  daily_loss_stop: 0.3
  max_positions: 5
  cooldown_minutes: 5
  max_total_exposure_pct: 60
  # 敞口上限兜底 (解决"敞口锁不住"): 对从历史/外部/重启同步继承来的超限持仓的处理
  #   reduce = 自动减仓至上限内 (真正锁住敞口, 优先平名义价值最大的持仓)
  #   halt   = 熔断停机 + 通知, 不平仓, 待人工处理
  #   off    = 不处理 (仅拦新开仓, 维持原行为; 继承来的超限持仓将一直保留)
  enforce_exposure_cap: "reduce"

# 策略参数 (引擎会按市场状态自动分配权重, 可在此开关)
strategies:
  grid:
    enabled: true
    levels: 10          # 网格层数
    grid_pct: 0.02      # 每格间距 2%
  ma_cross:
    enabled: true
    fast: 8
    slow: 21
  rsi:
    enabled: true
    period: 14
    oversold: 30
    overbought: 70
  bollinger:
    enabled: true
    period: 20
    std: 2.0

# 信号阈值
signal:
  open_threshold: 0.15     # |综合评分| 超过此值开仓 (激进模式)
  close_threshold: 0.0     # 0=禁用"信号消失"平仓, 持仓只靠止盈止损离场 (修复被频繁晃下车)

# 仓位管理 (ATR 止盈止损)
position:
  tp_atr: 3.9              # 止盈 = 入场价 ± 3.9 * ATR
  sl_atr: 2.7              # 止损 = 入场价 ∓ 2.7 * ATR
  min_tp_pct: 0.0025       # 止盈最小距离 0.25% (至少覆盖2.5倍手续费, 防止止盈被手续费吃掉)
  min_sl_pct: 0.0015       # 止损最小距离 0.15%

# 手续费 (USDT-M 合约默认)
fees:
  maker: 0.0002
  taker: 0.0005

# paper 模式初始资金 (USDT)
paper_initial_balance: 10000

# Web 仪表盘
web:
  host: "127.0.0.1"
  port: 8090

# Telegram 通知 (需要 Bot Token + Chat ID, 留空则禁用)
# 获取: @BotFather 创建机器人得 token; @userinfobot 查询 chat_id
telegram:
  enabled: true
  bot_token: ""
  chat_id: ""

# AI 自动调参 (仅 multi 策略模式适用; donchian 模式禁用)
tuning:
  enabled: false
  interval_hours: 6
  symbol: BTCUSDT
  timeframe: "5m"
  bars: 2000          # 优化使用的K线数量
  trials: 20          # 每轮尝试的参数组合数

# 自动学习进化器 (仅 donchian 模式): 每天用最近行情回测策略池, 自动应用最优组合
learner:
  enabled: true
  days: 90            # 评估窗口: 最近90天
  interval_hours: 24  # 学习周期: 每24小时进化一次 (启动时立即学一轮)

# ML 门禁 / 选择器 (纯 numpy, 零依赖): 给 Donchian 信号当"门禁"过滤劣质单, 当"选择器"判趋势/震荡
# 模型需先离线训练: python ml_train.py  → 生成 data/ml_filter.pkl
# enabled=true 即生效 (前提是模型文件存在; 缺失会自动降级为关闭, 不影响原逻辑)
ml_filter:
  # 选择器已在 walk-forward 验证通过 (regime AUC≈0.86, 预测趋势命中率≈64%,  firing≈40%, 非退化) → 已开启;
  # 门禁 AUC≈0.52(≈随机) 无区分力 → 保持关闭。regime_threshold 存于模型文件内(≈0.021)。
  enabled: true        # 总开关
  gate: false          # 门禁: 当前 AUC≈0.52 无区分力, 暂不启用
  selector: true       # 选择器: 震荡市(regime=range)抑制 Donchian 开仓
  threshold: 0.55      # 门禁概率阈值 (门禁关闭时无效)
  days: 365            # 训练回看天数
  retrain_hours: 168   # 建议每周重训一次 (当前需手动跑 ml_train.py)
  model_file: data/ml_filter.pkl

# 日志
logging:
  level: INFO
  file: logs/quant.log






















